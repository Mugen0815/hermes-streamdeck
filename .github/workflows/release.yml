name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check that tag, package.json and manifest agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG.replace(/^v/, "");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const manifest = JSON.parse(fs.readFileSync("io.github.mugen0815.hermes-streamdeck.sdPlugin/manifest.json", "utf8")).Version;
            console.log({ tag, pkg, manifest });
            if (pkg !== tag || manifest !== tag + ".0") {
              console.error("Version mismatch: bump package.json and manifest.json before tagging.");
              process.exit(1);
            }
          '

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npm run pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.streamDeckPlugin \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes Streamdeck $TAG" \
            --generate-notes \
            --verify-tag
